# schedule 프론트/백엔드 리버스 프록시 (Blue/Green)
#
# 배치 위치: /etc/nginx/conf.d/schedule.conf
# 함께 필요: /etc/nginx/conf.d/service-url.inc  (현재 active 포트 변수)
#
# 라우팅:
#   /api/      → 백엔드 (Spring, $service_url 이 가리키는 active 포트)
#   그 외 경로 → 프론트엔드 정적 파일 (SPA, 다른 프로젝트의 빌드 산출물)
#
# 동작: deploy.sh 가 service-url.inc 의 $service_url 을 8081/8082 로 바꾸고
#       nginx -s reload 하면 백엔드 트래픽이 무중단으로 새 포트로 전환된다.

server {
    listen 80;
    server_name _;   # 도메인이 생기면 교체

    # 현재 active 백엔드 포트 ( $service_url 정의 )
    include /etc/nginx/conf.d/service-url.inc;

    # ===== 프론트엔드 (정적 파일, 기본 루트) =====
    # 다른 프로젝트에서 빌드한 산출물(dist/build)을 이 디렉터리에 배치한다.
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅: 실제 파일이 없으면 index.html 로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 백엔드 API =====
    location /api/ {
        proxy_pass $service_url;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 무중단 전환 시 끊김 완화
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
